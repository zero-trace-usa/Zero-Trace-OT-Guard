name: Repository privacy cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/privacy-cleanup.yml]
permissions:
  contents: read
  actions: write
  security-events: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove records tied to superseded personal-identity commits
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'CLEANUP'
          import hashlib, os, subprocess
          affected = set(['4b06b7eeecc5279ac5a2ac65c453e49f337d22c070565a21a38a83fb22d9967b', '59369ae697ab6861bd2e8472c4782236a04c310028fe08fc164f693c0fb4cb13', '5f8e6b70770a8fc07f416e680ca4d5f70d5006cd7607cb826fec2182b62ef29b', '81f51854ed352f3400684daa200e483fafb5798dbb7f0c3e7beb6c724da04547', 'c6b862faad4ea9f058262e5f170f91f7f20dffbedf6bd4b06f5fdf9ef29dfddd', 'f20c2391808809468526f0e38f12300a3cd0a7307c6d0129ffada127ba5f102d'])
          repo = os.environ['GITHUB_REPOSITORY']
          def api(*args, required=True):
              result = subprocess.run(['gh', 'api', *args], capture_output=True, text=True)
              if required and result.returncode:
                  raise RuntimeError('GitHub cleanup API request failed; inspect repository permissions')
              return result
          def selected(sha):
              return hashlib.sha256(sha.encode()).hexdigest() in affected
          runs = api('--paginate', f'/repos/{repo}/actions/runs?per_page=100', '--jq', '.workflow_runs[] | [.id,.head_sha] | @tsv')
          deleted_runs = 0
          for line in runs.stdout.splitlines():
              run_id, sha = line.split('\t')
              if selected(sha):
                  api('-X', 'DELETE', f'/repos/{repo}/actions/runs/{int(run_id)}')
                  deleted_runs += 1
          analyses = api('--paginate', f'/repos/{repo}/code-scanning/analyses?per_page=100', '--jq', '.[] | [.id,.commit_sha] | @tsv', required=False)
          deleted_analyses = 0
          analysis_failures = 0
          if analyses.returncode:
              analysis_failures += 1
          else:
              for line in analyses.stdout.splitlines():
                  analysis_id, sha = line.split('\t')
                  if selected(sha):
                      result = api('-X', 'DELETE', f'/repos/{repo}/code-scanning/analyses/{int(analysis_id)}?confirm_delete=true', required=False)
                      if result.returncode:
                          analysis_failures += 1
                      else:
                          deleted_analyses += 1
          print(f'::notice title=Privacy cleanup::Deleted {deleted_runs} superseded workflow runs and {deleted_analyses} code-scanning analyses; outstanding analysis operations: {analysis_failures}.')
          if analysis_failures:
              print('::warning title=Privacy cleanup follow-up::Some code-scanning records require repository administrator follow-up.')
          CLEANUP

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "zero-trace-ot-guard"
version = "1.0.0rc3"
description = "Passive-first OT network evidence analysis with approval-gated TCP connectivity checks"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zero-Trace"}]
dependencies = []
[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "bandit>=1.7"]
[project.scripts]
otguard = "otguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
[project]
name = "zero-trace-ot-guard"
version = "1.0.0rc5"
readme = "README.md"
description = "Passive-first OT network evidence analysis with approval-gated TCP connectivity checks"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Zero-Trace"}]
dependencies = []
[project.urls]
Homepage = "https://github.com/zero-trace-usa/Zero-Trace-OT-Guard"
Documentation = "https://github.com/zero-trace-usa/Zero-Trace-OT-Guard/blob/main/README.md"
Issues = "https://github.com/zero-trace-usa/Zero-Trace-OT-Guard/issues"
Changelog = "https://github.com/zero-trace-usa/Zero-Trace-OT-Guard/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "bandit>=1.7"]
[project.scripts]
otguard = "otguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otguard = ["assets/*.png"]
